[project]
name = "invest-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "yfinance>=0.2.50",
  "httpx>=0.27",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "markdown>=3.5",
  "pandas>=2",
  "numpy>=1.26",
  "requests>=2.31",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["radar*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
